services:
  # Servidor de modelos local. Só sobe com o perfil "local":
  #   docker compose --profile local up -d
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["local"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # descomente se tiver GPU NVIDIA configurada:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Ambiente do GraphRAG (indexação, prompt-tune e consultas via CLI).
  graphrag:
    build: ./docker/graphrag
    container_name: graphrag
    volumes:
      - ./data:/data            # raiz do GraphRAG (settings, prompts, input, output)
      - ./scripts:/scripts:ro   # scripts auxiliares
      - ./corpus:/corpus        # texto bruto e parser do corpus
    working_dir: /data
    tty: true
    stdin_open: true

  # API: grafo, consultas ao GraphRAG (com as etapas via SSE) e histórico.
  # Usa o mesmo índice (data/) e a mesma versão do GraphRAG do serviço acima.
  backend:
    build: ./app/backend
    container_name: graphrag-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data          # índice, settings, prompts e .env (chave de API)
      - ./storage:/storage    # SQLite com o histórico de consultas e avaliações
    restart: unless-stopped

  frontend:
    build: ./app/frontend
    container_name: graphrag-frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - API_PROXY_TARGET=http://backend:8000   # o Vite repassa /api ao backend
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
