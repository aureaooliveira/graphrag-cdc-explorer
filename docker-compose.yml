services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # descomente se tiver GPU NVIDIA configurada:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  graphrag:
    build: ./graphrag
    container_name: graphrag
    depends_on:
      - ollama
    volumes:
      - ./data:/data
    working_dir: /data
    tty: true
    stdin_open: true

  backend:
    build: ./app/backend
    container_name: graphrag-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
    restart: unless-stopped

  frontend:
    build: ./app/frontend
    container_name: graphrag-frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data: